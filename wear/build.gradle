plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

kotlin {
    jvmToolchain(17)
}

android {
    namespace 'it.vantaggi.scoreboardessential.wear'
    compileSdk 36

    // Optional release signing, mirroring the mobile module.
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    def hasKeystore = keystorePropertiesFile.exists()
    if (hasKeystore) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    defaultConfig {
        applicationId "it.vantaggi.scoreboardessential"
        minSdk 30
        targetSdk 34
        // Wear version codes use a 2000+ offset so they never collide with the phone APK.
        versionCode 2001
        versionName "1.0"
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation project(':shared')
    implementation libs.play.services.wearable
    implementation libs.androidx.recyclerview
    implementation libs.androidx.wear
    implementation libs.androidx.wear.remote.interactions
    implementation libs.androidx.appcompat
    implementation libs.android.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.localbroadcastmanager

    testImplementation libs.junit4
    testImplementation libs.mockito.core.wear
    testImplementation libs.robolectric.wear
    testImplementation libs.androidx.arch.core.testing
    testImplementation libs.kotlinx.coroutines.test.wear
    testImplementation libs.mockito.inline.wear
}
