pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    // Consente a Gradle di provvedere da solo la toolchain richiesta da
    // gradle/gradle-daemon-jvm.properties e da jvmToolchain(), senza dipendere
    // dalla JBR che Android Studio installa (oggi JDK 25, che Gradle 8.x non regge).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Scoreboard Essential"
include ':mobile'
include ':wear'
include ':shared'
