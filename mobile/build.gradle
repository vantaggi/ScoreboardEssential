plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
}

kotlin {
    jvmToolchain(17)
}

android {
    namespace 'it.vantaggi.scoreboardessential'
    compileSdk 36

    // Optional release signing. Create a git-ignored keystore.properties at the repo root with
    // storeFile/storePassword/keyAlias/keyPassword to sign release builds; otherwise release
    // builds are produced unsigned and debug builds are unaffected.
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    def hasKeystore = keystorePropertiesFile.exists()
    if (hasKeystore) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    defaultConfig {
        applicationId "it.vantaggi.scoreboardessential"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    lint {
        // Il gate protegge dai problemi NUOVI: la baseline congela il backlog
        // esistente invece di pretendere che venga svuotato prima di attivare lint.
        abortOnError = true
        warningsAsErrors = false
        baseline = file("lint-baseline.xml")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        viewBinding true
        dataBinding true
    }


    sourceSets {
        // MigrationTestHelper cerca gli schemi fra gli ASSET. Sotto Robolectric gli
        // asset visibili sono quelli dell'app, non quelli del source set di test:
        // vanno quindi agganciati alla variante debug (pochi KB, mai in release).
        debug.assets.srcDirs += files("$projectDir/schemas")
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        unitTests.all {
            useJUnitPlatform()
            testLogging {
                events "passed", "skipped", "failed"
            }
        }
    }
}

// Schemi Room esportati e versionati: senza di questi MigrationTestHelper non puo'
// validare che una migrazione produca lo schema che Room si aspetta -- le
// migrazioni verrebbero verificate contro se stesse, non contro una verita'.
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation(platform(libs.kotlin.bom))
    implementation libs.androidx.core.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation project(':shared')
    implementation libs.androidx.appcompat
    implementation libs.android.material
    implementation libs.play.services.wearable
    implementation libs.androidx.constraintlayout

    // Usate direttamente dal codice ma finora ereditate per via transitiva:
    // localbroadcastmanager arrivava a 1.0.0 quattro livelli sotto material,
    // coroutines-android sotto lifecycle-viewmodel-ktx.
    implementation libs.androidx.localbroadcastmanager
    implementation libs.kotlinx.coroutines.android

    testImplementation libs.robolectric
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.androidx.test.rules
    testImplementation libs.androidx.test.ext.junit.ktx
    // Dependencies for coroutines testing and LiveData
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.arch.core.testing
    testImplementation libs.truth

    // JUnit 5 for useJUnitPlatform()
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter.api
    testImplementation libs.junit.jupiter.engine
    testImplementation libs.junit.jupiter.params
    testImplementation libs.junit.vintage.engine
    testImplementation libs.junit.platform.launcher
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.mockito.android
    androidTestImplementation libs.androidx.test.rules

    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    testImplementation libs.androidx.room.testing
    implementation libs.colorpickerview
}
