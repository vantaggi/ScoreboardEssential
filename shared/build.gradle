plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

kotlin {
    jvmToolchain(17)
}

android {
    namespace 'it.vantaggi.scoreboardessential.shared'
    compileSdk 36

    defaultConfig {
        minSdk 30
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    // api, non implementation: OptimizedWearDataSync espone DataClient,
    // MessageClient, CapabilityClient e NodeClient nel proprio costruttore
    // pubblico, quindi il tipo fa parte della superficie del modulo.
    api libs.play.services.wearable
    implementation libs.kotlinx.coroutines.play.services

    testImplementation libs.junit4
    testImplementation libs.mockito.kotlin.shared
    testImplementation libs.mockito.inline.mobile
    testImplementation libs.kotlinx.coroutines.test
}
