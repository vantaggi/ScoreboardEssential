plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'it.vantaggi.scoreboardessential.shared'
    compileSdk 34

    defaultConfig {
        minSdk 30
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.play.services.wearable.shared
    implementation libs.kotlinx.coroutines.play.services

    testImplementation libs.junit4
    testImplementation libs.mockito.kotlin.shared
    testImplementation libs.mockito.inline.mobile
    testImplementation libs.kotlinx.coroutines.test
}
