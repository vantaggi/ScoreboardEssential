junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
robolectric-mobile = { group = "org.robolectric", name = "robolectric", version.ref = "robolectricMobile" }
robolectric-wear = { group = "org.robolectric", name = "robolectric", version.ref = "robolectricWear" }
mockito-core-mobile = { group = "org.mockito", name = "mockito-core", version.ref = "mockitoMobile" }
mockito-core-wear = { group = "org.mockito", name = "mockito-core", version.ref = "mockitoWear" }
mockito-android = { group = "org.mockito", name = "mockito-android", version.ref = "mockitoMobile" }
mockito-inline-mobile = { group = "org.mockito", name = "mockito-inline", version.ref = "mockitoInlineMobile" }
mockito-inline-wear = { group = "org.mockito", name = "mockito-inline", version.ref = "mockitoInlineWear" }
mockito-kotlin-mobile = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlinMobile" }
mockito-kotlin-shared = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlinShared" }
androidx-arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCoreTesting" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "testRules" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testJunitExt" }
androidx-test-ext-junit-ktx = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "testJunitExt" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
