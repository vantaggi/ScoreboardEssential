# Unica fonte di verita' per versioni di plugin e dipendenze.
#
# Regola: una coordinata, una versione. Le dipendenze di produzione sono
# allineate; restano volutamente divergenti solo quelle di test, che vengono
# unificate insieme all'aggiornamento dell'infrastruttura di test (Robolectric,
# Mockito) in un commit dedicato.

[versions]
agp = "8.13.0"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
ktlintPlugin = "12.1.1"
ktlintEngine = "1.3.1"

activity = "1.9.3"
appcompat = "1.7.1"
constraintlayout = "2.2.1"
coreKtx = "1.13.1"
coroutines = "1.8.1"
fragmentKtx = "1.8.1"
lifecycle = "2.8.7"
localbroadcast = "1.1.0"
material = "1.13.0"
playServicesWearable = "19.0.0"
recyclerview = "1.3.2"
room = "2.8.4"
wear = "1.3.0"
wearRemoteInteractions = "1.1.0"
colorpicker = "2.3.0"

# --- test ---------------------------------------------------------------------
# Ancora divergenti fra i moduli: si allineano con l'aggiornamento di Robolectric,
# che e' un passo a se' perche' e' un prerequisito duro per targetSdk 36.
archCoreTesting = "2.2.0"
espresso = "3.6.1"
testRules = "1.6.0"
testJunitExt = "1.2.1"
truth = "1.4.2"
junit4 = "4.13.2"
junit5 = "5.10.2"
robolectricMobile = "4.12.2"
robolectricWear = "4.10.3"
mockitoMobile = "5.12.0"
mockitoWear = "4.8.0"
mockitoInlineMobile = "5.2.0"
mockitoInlineWear = "4.8.0"
mockitoKotlinMobile = "5.3.1"
mockitoKotlinShared = "5.2.1"
coroutinesTest = "1.8.1"
coroutinesTestWear = "1.7.1"

[libraries]
kotlin-bom = { group = "org.jetbrains.kotlin", name = "kotlin-bom", version.ref = "kotlin" }

androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-localbroadcastmanager = { group = "androidx.localbroadcastmanager", name = "localbroadcastmanager", version.ref = "localbroadcast" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-wear = { group = "androidx.wear", name = "wear", version.ref = "wear" }
androidx-wear-remote-interactions = { group = "androidx.wear", name = "wear-remote-interactions", version.ref = "wearRemoteInteractions" }
android-material = { group = "com.google.android.material", name = "material", version.ref = "material" }

androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

colorpickerview = { group = "com.github.skydoves", name = "colorpickerview", version.ref = "colorpicker" }

kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
kotlinx-coroutines-test-wear = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTestWear" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit5" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params" }
